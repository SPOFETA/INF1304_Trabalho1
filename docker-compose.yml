name: inf1304-trabalho-1

services:
  kafka-1:
    image: apache/kafka:latest
    container_name: kafka-1
    ports:
      - "9092:9092"
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-1:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: # Montagem de volume para persistência de dados do Kafka
      - kafka-data-1:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations: 
          memory: 512M
    networks:
      - int-network

  kafka-2:
    image: apache/kafka:latest
    container_name: kafka-2
    ports: 
      - "9094:9092" # Portas para comunicação com clientes Kafka, esquerda exterior - direta dentro do container
    environment:
      KAFKA_KRAFT_MODE: 'true'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller' # Define os papéis do nó Kafka (broker e controller)
      # Controller interno
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093'
      # Listeners
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-2:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      # Listener usado pelos brokers para comunicação interna
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      # Listener usado pelo controller
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # Configurações para um único broker
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data-2:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    networks:
      - int-network
  
  init-kafka: # Containter temporoario para criar o topico conforme o enunciado
    image: apache/kafka:latest
    container_name: init-kafka
    depends_on:
      - kafka-1
      - kafka-2
    networks:
      - int-network
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
      echo 'A aguardar que o Kafka inicie...'
      sleep 15
      /opt/kafka/bin/kafka-topics.sh --create --if-not-exists --topic dados-sensores --bootstrap-server kafka-1:9092 --partitions 2 --replication-factor 2
      echo 'Tópico dados-sensores criado com sucesso!'"
  
  sensor-produtor:
    build: ./producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: 'kafka-1:9092,kafka-2:9092'
      SENSOR_NOME: 'sensor-fabrica'
    depends_on:
      - init-kafka
    networks:
      - int-network

volumes:
  kafka-data-1:
  kafka-data-2:

networks:
  ext-network:
    driver: bridge
  int-network:
    driver: bridge
    internal: true
  
